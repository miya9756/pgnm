<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>PGNM Studio</title>
  <meta name="description" content="Add real camera noise and film grain to any photo with PGNM, entirely in your browser.">
  <meta name="theme-color" content="#0b0b0c">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23121214'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%23ff6b3d'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
  <script type="module" src="js/app.js"></script>
</head>
<body class="busy">
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-camera" viewBox="0 0 24 24"><path d="M4 8.5h3.2L9 6h6l1.8 2.5H20v10H4z"/><circle cx="12" cy="13.2" r="3.3"/></symbol>
    <symbol id="i-film" viewBox="0 0 24 24"><rect x="4" y="3.5" width="16" height="17" rx="2"/><path d="M8 3.5v17M16 3.5v17M4 8h4M4 12h4M4 16h4M16 8h4M16 12h4M16 16h4"/></symbol>
    <symbol id="i-dice" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="4"/><g fill="currentColor" stroke="none"><circle cx="8.8" cy="8.8" r="1.35"/><circle cx="15.2" cy="8.8" r="1.35"/><circle cx="12" cy="12" r="1.35"/><circle cx="8.8" cy="15.2" r="1.35"/><circle cx="15.2" cy="15.2" r="1.35"/></g></symbol>
    <symbol id="i-open" viewBox="0 0 24 24"><path d="M12 15.5V4.5M7.5 9 12 4.5 16.5 9"/><path d="M4.5 14.5v3.5a1.5 1.5 0 0 0 1.5 1.5h12a1.5 1.5 0 0 0 1.5-1.5v-3.5"/></symbol>
    <symbol id="i-save" viewBox="0 0 24 24"><path d="M12 4.5v11M7.5 11 12 15.5 16.5 11"/><path d="M4.5 14.5v3.5a1.5 1.5 0 0 0 1.5 1.5h12a1.5 1.5 0 0 0 1.5-1.5v-3.5"/></symbol>
    <symbol id="i-split" viewBox="0 0 24 24"><path d="M9.5 7.5 5 12l4.5 4.5M14.5 7.5 19 12l-4.5 4.5"/></symbol>
    <symbol id="i-image" viewBox="0 0 24 24"><rect x="3.5" y="4.5" width="17" height="15" rx="2.5"/><circle cx="9" cy="10" r="1.8"/><path d="m4 18 5.5-5.5 4 4 2.5-2.5 4.5 4.5"/></symbol>
  </svg>

  <header class="bar">
    <a class="brand" href="https://github.com/miya9756/pgnm" target="_blank" rel="noopener" title="PGNM on GitHub">
      <i class="dot" aria-hidden="true"></i><span>PGNM</span>
    </a>
    <div class="actions">
      <button class="icon" id="open" title="Open image  (O)" aria-label="Open image"><svg><use href="#i-open"/></svg></button>
      <button class="icon primary" id="save" title="Save PNG  (S)" aria-label="Save PNG"><svg><use href="#i-save"/></svg></button>
    </div>
    <input type="file" id="file" accept="image/*" hidden>
  </header>

  <main class="viewer" id="viewer">
    <canvas aria-label="Clean and noisy image, side by side"></canvas>
    <div class="progress" aria-hidden="true"><i></i></div>
    <span class="tag">Clean</span>
    <span class="tag tag-after"><i class="dot" aria-hidden="true"></i><span id="look"></span></span>
    <div class="split" role="slider" tabindex="0" aria-label="Compare" aria-valuemin="0" aria-valuemax="100" aria-valuenow="50">
      <i class="split-line"></i><span class="split-knob"><svg><use href="#i-split"/></svg></span>
    </div>
    <div class="dock">
      <div class="zoom" role="group" aria-label="Zoom">
        <button data-zoom="fit" title="Fit  (F)">Fit</button>
        <button data-zoom="1" title="100%  (1)">1:1</button>
        <button data-zoom="2" title="200%  (2)">2:1</button>
      </div>
      <button class="seed" id="reroll" title="New noise  (R)" aria-label="New noise, seed 2026">
        <svg><use href="#i-dice"/></svg><span id="seed">2026</span>
      </button>
    </div>
    <div class="drop" aria-hidden="true"><svg><use href="#i-image"/></svg></div>
  </main>

  <aside class="panel">
    <nav class="tabs" role="tablist" id="tabs"></nav>
    <div class="looks" id="looks"></div>
    <footer class="credits">
      <a href="https://arxiv.org/abs/2610.39868" target="_blank" rel="noopener">Paper</a>
      <a href="https://github.com/miya9756/pgnm" target="_blank" rel="noopener">Code</a>
      <span>© 2026 Mingyang Song · CC BY-NC-ND 4.0</span>
    </footer>
  </aside>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</body>
</html>
