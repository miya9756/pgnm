[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pgnm"
version = "5.0.0"
description = "PGNM: full RGB convolution and conditional residual quantiles"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "numba>=0.59"]

[project.optional-dependencies]
images = ["pillow>=9"]

[tool.setuptools]
packages = ["pgnm"]
package-dir = {pgnm = "."}
